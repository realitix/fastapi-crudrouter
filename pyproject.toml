[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-crudrouter"
dynamic = ["version"]
description = "A dynamic FastAPI router that automatically creates CRUD routes for your models"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Adam Watkins", email = "hello@awtkns.com"}
]
maintainers = [
    {name = "Adam Watkins", email = "hello@awtkns.com"}
]
keywords = ["fastapi", "crud", "restful", "routing", "generator", "crudrouter", "sqlalchemy", "async"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.62.0",
    "sqlalchemy[asyncio]>=1.4.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/awtkns/fastapi-crudrouter"
Documentation = "https://fastapi-crudrouter.awtkns.com"
Repository = "https://github.com/awtkns/fastapi-crudrouter"
Issues = "https://github.com/awtkns/fastapi-crudrouter/issues"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy-utils>=0.41.0",
    
    # Linting and formatting
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    
    # Type stubs
    "types-setuptools",
]

[tool.setuptools.dynamic]
version = {attr = "fastapi_crudrouter._version.__version__"}

[tool.setuptools.packages.find]
include = ["fastapi_crudrouter*"]

[tool.setuptools.package-data]
fastapi_crudrouter = ["py.typed"]

# Ruff configuration
[tool.ruff]
target-version = "py38"
line-length = 88
fix = true

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments to function call
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "PLW2901", # for loop variable overwritten by assignment target
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # unused function arguments in tests
    "S101",   # use of assert detected in tests
    "PLR2004", # magic value used in comparison in tests
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_crudrouter"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pylint configuration
[tool.pylint.main]
load-plugins = ["pylint.extensions.docparams"]
jobs = 0  # Use all available processors

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "duplicate-code",
    "fixme",
    "broad-except",
    "unused-argument",  # handled by ruff
    "import-error",     # handled by mypy
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 20
max-attributes = 15

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false
strict_equality = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "sqlalchemy_utils.*", 
    "uvicorn.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

# Coverage configuration (if you want to add it later)
[tool.coverage.run]
source = ["fastapi_crudrouter"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "mypy>=1.14.1",
    "pylint>=3.2.7",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.5",
    "sqlalchemy-utils>=0.41.2",
    "types-setuptools>=75.8.0.20250110",
]
